<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ご依頼内容の確認 | SŌRIN Relocation</title>
<style>
:root{color-scheme:light;--navy:#16343a;--teal:#168b8b;--gold:#d4af37;--line:#dce6e6}
*{box-sizing:border-box}
body{margin:0;background:#f4f7f7;color:#26383b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:24px 15px 48px}
.brand{text-align:center;color:var(--navy);font-weight:800;letter-spacing:.08em;font-size:20px;margin:8px 0 22px}
.brand span{color:var(--gold)}
h1{font-size:21px;margin:0 0 8px;color:var(--navy)}
.intro{font-size:14px;line-height:1.8;color:#526568;margin:0 0 20px}
.section{background:#fff;border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden}
.section h2{font-size:15px;margin:0;padding:13px 15px;background:#edf5f5;color:var(--navy)}
.row{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:12px 15px;border-top:1px solid #edf1f1;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.label{color:#657679;font-weight:700}.value{white-space:pre-wrap}
.status{text-align:center;padding:34px 12px;color:#637477}
.footer{text-align:center;color:#879496;font-size:11px;margin-top:25px}
@media(max-width:420px){.row{grid-template-columns:92px 1fr;gap:9px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">SŌRIN <span>Relocation</span></div>
  <h1>ご依頼内容の確認</h1>
  <p class="intro">お見積もりのご依頼ありがとうございます。以下の内容をご確認ください。ご希望日時は確定ではありません。内容確認後、担当者より改めてご連絡いたします。</p>
  <div id="content" class="status">ご依頼内容を読み込んでいます…</div>
  <div class="footer">SŌRIN Relocation</div>
</main>
<script>
(async()=>{
  const root=document.getElementById('content');
  const token=new URLSearchParams(location.search).get('t')||'';
  if(!/^[0-9a-f-]{36}$/i.test(token)){
    root.textContent='確認ページのURLが正しくありません。LINEに届いたリンクから開き直してください。';
    return;
  }
  try{
    const endpoint='https://raelrzegewoftknalsws.supabase.co/functions/v1/line-estimate-notify?t='+encodeURIComponent(token);
    const response=await fetch(endpoint,{headers:{'apikey':'sb_publishable_2Hzm21bczQC7uhCtrGHn1Q_8OhA_K9o'}});
    const result=await response.json();
    if(!response.ok||!result.ok)throw new Error(result.error||'ご依頼内容を確認できませんでした。');
    const snapshot=result.snapshot||{};
    root.className='';
    root.replaceChildren();
    for(const section of (snapshot.sections||[])){
      const box=document.createElement('section');box.className='section';
      const heading=document.createElement('h2');heading.textContent=section.title||'';box.append(heading);
      for(const item of (section.rows||[])){
        if(!item.value)continue;
        const row=document.createElement('div');row.className='row';
        const label=document.createElement('div');label.className='label';label.textContent=item.label||'';
        const value=document.createElement('div');value.className='value';value.textContent=item.value;
        row.append(label,value);box.append(row);
      }
      root.append(box);
    }
    if(!root.children.length)root.textContent='表示できるご依頼内容がありません。SŌRINまでお問い合わせください。';
  }catch(error){
    root.textContent=error.message||'ご依頼内容を読み込めませんでした。時間をおいて再度お試しください。';
  }
})();
</script>
</body>
</html>
